name: Fetch service images
description: >-
  Pulls the MariaDB and Redis images that matomo-org/github-action-tests starts, with retries, and falls back to a
  copy in the Actions cache when the registry keeps failing. Push and scheduled runs keep that copy up to date.
inputs:
  mariadb-version:
    description: MariaDB version to fetch, empty for none
    default: ''
  redis:
    description: Whether to fetch the Redis master and sentinel images
    default: 'false'
runs:
  using: composite
  steps:
    - name: Pull service images
      id: pull
      shell: bash
      env:
        MARIADB_VERSION: ${{ inputs.mariadb-version }}
        REDIS: ${{ inputs.redis }}
      run: |
        # Must match the image references in matomo-org/github-action-tests, so its docker run finds them locally.
        images=()
        if [ -n "$MARIADB_VERSION" ]; then
          images+=("mirror.gcr.io/library/mariadb:$MARIADB_VERSION")
        fi
        if [ "$REDIS" = true ]; then
          # A loaded image loses its digest, so the action pulls these again until it references Redis by tag.
          images+=(
            mirror.gcr.io/bitnamisecure/redis@sha256:1347d526ecec0c6537e99eac09e7c3405c21664f6044ff60e78b0898da37abd2
            mirror.gcr.io/bitnamisecure/redis-sentinel@sha256:96317ad4ce459771b81271607afb9c35a7bb50acb7cad26a273e3c1b5fac581e
          )
        fi
        [ ${#images[@]} -gt 0 ] || exit 0
        echo "images=${images[*]}" >> "$GITHUB_OUTPUT"
        echo "key=service-images-$(echo "${images[*]}" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
        for image in "${images[@]}"; do
          for attempt in 1 2 3; do
            if docker pull -q "$image"; then
              continue 2
            fi
            [ "$attempt" = 3 ] || sleep $((attempt * 10))
          done
          echo "::warning::Could not pull $image, loading the service images from the Actions cache instead"
          echo "failed=true" >> "$GITHUB_OUTPUT"
          exit 0
        done
    - name: Restore service images from the Actions cache
      id: restore
      if: steps.pull.outputs.failed == 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/service-images
        key: ${{ steps.pull.outputs.key }}
    - name: Load service images
      if: steps.restore.outputs.cache-hit == 'true'
      shell: bash
      run: docker load -i "$RUNNER_TEMP/service-images/images.tar"
    - name: Check the Actions cache for the service images
      id: cached
      if: steps.pull.outputs.key != '' && steps.pull.outputs.failed != 'true' && contains('push,schedule', github.event_name)
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/service-images
        key: ${{ steps.pull.outputs.key }}
        lookup-only: true
    - name: Save service images
      if: steps.cached.outcome == 'success' && steps.cached.outputs.cache-hit != 'true'
      shell: bash
      env:
        IMAGES: ${{ steps.pull.outputs.images }}
      run: |
        mkdir -p "$RUNNER_TEMP/service-images"
        docker save -o "$RUNNER_TEMP/service-images/images.tar" $IMAGES
    - name: Store service images in the Actions cache
      if: steps.cached.outcome == 'success' && steps.cached.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/service-images
        key: ${{ steps.pull.outputs.key }}
