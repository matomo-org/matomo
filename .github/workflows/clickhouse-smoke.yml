# ClickHouse POC (DEV-20678): proves a ClickHouse service can run in Matomo CI with a
# passing smoke test. Lives only on the clickhouse POC branch — intentionally a
# standalone workflow, not part of matomo-tests.yml: ClickHouse only ever backs the
# log_* tables, so its tests are opt-in (tests/ClickHouse/) and never join the
# standard test bootstrap.

name: ClickHouse Smoke Test

on:
  push:
    branches:
      - 'clickhouse'
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  actions: read
  checks: none
  contents: read
  deployments: none
  issues: none
  packages: none
  pull-requests: none
  repository-projects: none
  security-events: none
  statuses: none

concurrency:
  group: clickhouse-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: ClickHouse smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      clickhouse:
        # Keep image + credentials in sync with .ddev/docker-compose.clickhouse.yaml.
        # Since 25.x the image locks the passwordless default user to localhost, so an
        # explicit user is required for connections from outside the container.
        image: clickhouse/clickhouse-server:25.8
        env:
          CLICKHOUSE_USER: matomo
          CLICKHOUSE_PASSWORD: matomo
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl
          coverage: none
      - name: Install dependencies
        run: composer install --dev --prefer-dist --no-progress --no-suggest
      - name: Run ClickHouse smoke test
        env:
          CLICKHOUSE_HOST: 127.0.0.1
          CLICKHOUSE_PORT: '8123'
          CLICKHOUSE_USER: matomo
          CLICKHOUSE_PASSWORD: matomo
        run: ./vendor/bin/phpunit -c tests/ClickHouse/phpunit-clickhouse.xml --testdox

  # TEMPORARY diagnostic: the ClickHouseStatus UI test showed web-served PHP (php-fpm)
  # failing to reach the ClickHouse service while CLI PHP succeeds. This job reproduces
  # the php-fpm context (system php-fpm via systemd, like matomo-org/github-action-tests
  # sets up) and prints the actual curl error. Remove once root-caused.
  fpm-probe:
    name: php-fpm to ClickHouse probe
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        env:
          CLICKHOUSE_USER: matomo
          CLICKHOUSE_PASSWORD: matomo
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Set up system php-fpm like github-action-tests does
        run: |
          sudo apt-get update -q >/dev/null
          sudo apt-get install -y -q php8.1-fpm php8.1-curl nginx >/dev/null
          sudo systemctl start php8.1-fpm.service
      - name: Write probe script and nginx site
        run: |
          sudo mkdir -p /var/www/probe
          sudo tee /var/www/probe/probe.php >/dev/null <<'PHP'
          <?php
          header('Content-Type: text/plain');
          echo "sapi=" . php_sapi_name() . "\n";
          foreach (['http://127.0.0.1:8123/ping', 'http://localhost:8123/ping'] as $url) {
              $ch = curl_init($url);
              curl_setopt_array($ch, [CURLOPT_RETURNTRANSFER => true, CURLOPT_CONNECTTIMEOUT => 3, CURLOPT_TIMEOUT => 5]);
              $body = curl_exec($ch);
              printf("%s => code=%s errno=%d error=%s body=%s\n", $url, curl_getinfo($ch, CURLINFO_HTTP_CODE), curl_errno($ch), curl_error($ch), var_export($body, true));
              curl_close($ch);
          }
          $fp = @fsockopen('127.0.0.1', 8123, $errno, $errstr, 3);
          printf("fsockopen 127.0.0.1:8123 => %s (errno=%d %s)\n", $fp ? 'OK' : 'FAIL', $errno, $errstr);
          PHP
          sudo tee /etc/nginx/sites-enabled/probe.conf >/dev/null <<'NGINX'
          server {
              listen 8090;
              root /var/www/probe;
              location ~ \.php$ {
                  include snippets/fastcgi-php.conf;
                  fastcgi_pass unix:/run/php/php8.1-fpm.sock;
              }
          }
          NGINX
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo systemctl restart nginx
      - name: Probe via php-fpm (web context)
        run: curl -s http://127.0.0.1:8090/probe.php
      - name: Probe via CLI for contrast
        run: php8.1 -r 'var_dump(file_get_contents("http://127.0.0.1:8123/ping"));'
