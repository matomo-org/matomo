name: Service image test

on:
  pull_request:
  push:
    branches: [throwaway-id-309-svc-6x]
  workflow_dispatch:
    inputs:
      block:
        description: 'Block mirror.gcr.io: none, full, first (unblocked after 20 s), redis (database image pulled first, then blocked)'
        type: choice
        options: [none, full, first, redis]
        default: none
      cache:
        type: boolean
        default: true
      cache-down:
        description: 'Make the Actions cache service unreachable'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  UnitTests:
    name: UnitTests (${{ matrix.env.php }}, ${{ matrix.env.engine }}, ${{ matrix.env.version }}, redis ${{ matrix.env.redis }}${{ matrix.env.runner && ', runner MySQL' || '' }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        env:
          - { php: '8.1', engine: 'Mysql', version: '8.0', redis: true, runner: true }
          - { php: '8.2', engine: 'Mariadb', version: '10.6', redis: true }
          - { php: '8.2', engine: 'Mariadb', version: '10.6', redis: false }
          - { php: '8.2', engine: 'Mysql', version: '8.0', redis: false }
          - { php: '8.1', engine: 'Mysql', version: '8.0', redis: false, runner: true }
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          persist-credentials: false
          submodules: true
          path: matomo
      - name: Service image test setup (throwaway)
        env:
          BLOCK: ${{ github.event_name == 'pull_request' && 'full' || inputs.block || 'none' }}
          BREAK_SAVE: ${{ contains(github.event.head_commit.message, '[break-save]') }}
          CACHE_DOWN: ${{ inputs.cache-down || contains(github.event.head_commit.message, '[cache-down]') }}
          DB_IMAGE: ${{ !matrix.env.runner && format('mirror.gcr.io/library/{0}:{1}', matrix.env.engine == 'Mariadb' && 'mariadb' || 'mysql', matrix.env.version) || '' }}
        run: |
          echo "block=$BLOCK break-save=$BREAK_SAVE cache-down=$CACHE_DOWN db-image=$DB_IMAGE"
          case "$BLOCK" in
            redis) [ -z "$DB_IMAGE" ] || docker pull -q "$DB_IMAGE" ;;&
            full|first|redis) echo "0.0.0.0 mirror.gcr.io" | sudo tee -a /etc/hosts ;;&
            first) nohup sh -c 'sleep 20; sudo sed -i "/mirror.gcr.io/d" /etc/hosts' >/dev/null 2>&1 & ;;
          esac
          # a file where the action wants a directory makes docker save fail
          if [ "$BREAK_SAVE" = true ]; then touch "$RUNNER_TEMP/matomo-service-images"; fi
          if [ "$CACHE_DOWN" = true ]; then echo "0.0.0.0 results-receiver.actions.githubusercontent.com" | sudo tee -a /etc/hosts; fi
      - name: Start MySQL
        if: ${{ matrix.env.runner }}
        run: |
          set -eu
          sudo systemctl stop mysql
          sudo mv /var/lib/mysql /var/lib/mysql-disk
          sudo mkdir /var/lib/mysql
          sudo mount -t tmpfs -o size=6g tmpfs /var/lib/mysql
          sudo cp -a /var/lib/mysql-disk/. /var/lib/mysql/
          printf '[mysqld]\nsql_mode = NO_ENGINE_SUBSTITUTION,STRICT_TRANS_TABLES\nwait_timeout = 36000\nmax_allowed_packet = 134209536\nlocal_infile = 1\n' \
            | sudo tee /etc/mysql/conf.d/matomo.cnf > /dev/null
          sudo systemctl start mysql
          mysql -h127.0.0.1 -uroot -proot -e "ALTER USER 'root'@'localhost' IDENTIFIED BY ''; CREATE DATABASE matomo_tests"
      - name: running tests
        uses: matomo-org/github-action-tests@throwaway-id-309-merged
        with:
          test-type: 'UnitTests'
          mysql-service: ${{ !matrix.env.runner }}
          mysql-engine: ${{ matrix.env.engine }}
          mysql-version: ${{ matrix.env.version }}
          php-version: ${{ matrix.env.php }}
          redis-service: ${{ matrix.env.redis }}
          service-image-cache: ${{ github.event_name != 'workflow_dispatch' || inputs.cache }}
      - name: Verify services (throwaway)
        env:
          REDIS: ${{ matrix.env.redis }}
        run: |
          docker ps --format '{{.Names}} {{.Image}} {{.Status}}'
          if [ "$REDIS" = true ]; then
            docker exec redis redis-cli ping
            docker exec mymaster redis-cli -p 26379 sentinel get-master-addr-by-name mymaster
          fi
          mysqladmin ping -h127.0.0.1 -uroot
