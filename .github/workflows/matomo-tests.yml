name: Service image test

on:
  pull_request:
  workflow_dispatch:
    inputs:
      block:
        description: 'Block mirror.gcr.io: none, full, or first (unblocked after 5 s)'
        type: choice
        options: [none, full, first]
        default: none
      cache:
        type: boolean
        default: true
      break-save:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  UnitTests:
    name: UnitTests (${{ matrix.env.php }}, ${{ matrix.env.engine }}, ${{ matrix.env.version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        env:
          - { php: '7.2', engine: 'Mysql', version: '5.7' }
          - { php: '8.2', engine: 'Mariadb', version: '11.4' }
          - { php: '8.6', engine: 'Mysql', version: '8.0' }
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          persist-credentials: false
          submodules: true
          path: matomo
      - name: Service image test setup (throwaway)
        env:
          BLOCK: ${{ github.event_name == 'pull_request' && 'full' || inputs.block || 'none' }}
          BREAK_SAVE: ${{ inputs.break-save || false }}
        run: |
          echo "block=$BLOCK break-save=$BREAK_SAVE"
          case "$BLOCK" in
            full) echo "0.0.0.0 mirror.gcr.io" | sudo tee -a /etc/hosts ;;
            first)
              echo "0.0.0.0 mirror.gcr.io" | sudo tee -a /etc/hosts
              nohup sh -c 'sleep 5; sudo sed -i "/mirror.gcr.io/d" /etc/hosts' >/dev/null 2>&1 &
              ;;
          esac
          # a file where the action wants a directory makes docker save fail
          if [ "$BREAK_SAVE" = true ]; then touch "$RUNNER_TEMP/matomo-service-images"; fi
      - name: running tests
        uses: matomo-org/github-action-tests@id-309-redis-version-tag
        with:
          test-type: 'UnitTests'
          mysql-service: true
          mysql-engine: ${{ matrix.env.engine }}
          mysql-version: ${{ matrix.env.version }}
          php-version: ${{ matrix.env.php }}
          redis-service: true
          service-image-cache: ${{ github.event_name != 'workflow_dispatch' || inputs.cache }}
      - name: Verify services (throwaway)
        run: |
          docker ps --format '{{.Names}} {{.Image}} {{.Status}}'
          docker exec redis redis-cli ping
          docker exec mymaster redis-cli -p 26379 sentinel get-master-addr-by-name mymaster
          mysqladmin ping -h127.0.0.1 -uroot
