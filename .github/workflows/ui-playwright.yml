# Matomo UI tests on Playwright Test.
#
# Runs the specs in tests/playwright against Matomo served by PHP's built-in server on the runner, with
# the runner's MySQL. Screenshot baselines live in tests/playwright/screenshots and are only ever
# written by this workflow: run it with "update screenshots" (or put [update-screenshots] in the
# commit message) and commit the "playwright-screenshots" artifact.

name: UI tests (Playwright)

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches:
      - '[0-9]+.x-dev'
      - 'new-ci-cd-test-dont-merge'
  workflow_dispatch:
    inputs:
      update_screenshots:
        description: 'Write new screenshot baselines instead of comparing'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ui-playwright-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.1'
  NODE_VERSION: '24'

jobs:
  playwright:
    name: UI (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      MATOMO_URL: 'http://localhost/'
      PLAYWRIGHT_UPDATE_SNAPSHOTS: ${{ (inputs.update_screenshots || contains(github.event.head_commit.message, '[update-screenshots]')) && 'changed' || 'none' }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          persist-credentials: false
          submodules: true

      # the MySQL 8.0 preinstalled on the runner image, so no container registry can fail the job
      - name: Start MySQL
        run: |
          sudo cp tests/playwright/ci/my.cnf /etc/mysql/conf.d/matomo.cnf
          sudo systemctl start mysql
          mysql -h127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS matomo_tests; SET GLOBAL local_infile = 1"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, curl, zip, pdo_mysql, mysqli, gd, zlib, opcache
          # same as matomo-org/github-action-tests; with opcache on, request workers crash without a reply
          ini-values: >-
            memory_limit=768M, max_execution_time=10000, error_reporting=E_ALL, log_errors=on,
            error_log=${{ github.workspace }}/tmp/logs/php-errors.log, display_errors=on,
            zend.exception_ignore_args=Off, mysqli.allow_local_infile=On, opcache.enable=0
          tools: composer:v2
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-

      - name: Composer install
        run: composer install --no-interaction --no-progress --prefer-dist

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tests/playwright/package-lock.json

      - name: npm ci
        working-directory: tests/playwright
        run: npm ci --no-audit --no-fund

      - name: Get Playwright version
        id: playwright
        working-directory: tests/playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: tests/playwright
        # no --with-deps: the runner image already has the system libraries, and apt mirrors have broken UI jobs before
        run: npx playwright install chromium

      - name: Configure Matomo and start PHP
        run: |
          set -eu
          cp tests/playwright/ci/config.ini.php config/config.ini.php
          mkdir -p tmp/assets tmp/cache/tracker tmp/latest tmp/logs tmp/sessions tmp/templates_c tmp/tcpdf tmp/climulti
          chmod -R 777 tmp

          # PHP's built-in server with several workers is enough for one browser, and needs no
          # nginx or php-fpm pool. Port 80, because Matomo builds some URLs without the port.
          sudo setcap CAP_NET_BIND_SERVICE=+eip "$(readlink -f "$(command -v php)")"
          PHP_CLI_SERVER_WORKERS=8 nohup php -S 0.0.0.0:80 -t "$GITHUB_WORKSPACE" > tmp/logs/php-server.log 2>&1 &

          # the test proxy answers 403 until the fixture setup marks this instance, so check a plain PHP file
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost/index.php && exit 0
            sleep 1
          done
          echo 'PHP server is not answering'
          cat tmp/logs/php-server.log
          exit 1

      - name: Run Playwright tests
        working-directory: tests/playwright
        run: npx playwright test

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            tests/playwright/playwright-report
            tests/playwright/test-results
            tmp/logs
          retention-days: 14

      - name: Upload screenshot baselines
        if: ${{ !cancelled() && env.PLAYWRIGHT_UPDATE_SNAPSHOTS != 'none' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-screenshots
          path: tests/playwright/screenshots
          retention-days: 14
