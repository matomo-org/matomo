# nginx for the Playwright UI tests on GitHub Actions. {ROOT} and {PHP_SOCKET} are filled in by the workflow.
worker_processes 4;
pid {ROOT}/tmp/nginx.pid;
error_log {ROOT}/tmp/logs/nginx-error.log;

events {
    worker_connections 768;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    access_log {ROOT}/tmp/logs/nginx-access.log;
    client_body_temp_path /tmp/nginx-client-body;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    proxy_temp_path /tmp/nginx-proxy;
    scgi_temp_path /tmp/nginx-scgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;

    server {
        listen 80;
        root {ROOT};
        index index.php index.html;

        location / {
            try_files $uri $uri/ /index.php;
        }

        location ~ \.php(/|$) {
            fastcgi_pass unix:{PHP_SOCKET};
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            fastcgi_read_timeout 300s;
        }
    }
}
