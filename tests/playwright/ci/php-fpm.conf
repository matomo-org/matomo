; php-fpm pool for the Playwright UI tests on GitHub Actions. {USER} and {PHP_SOCKET} are filled in by the workflow.
[playwright]
user = {USER}
group = {USER}
listen = {PHP_SOCKET}
listen.owner = {USER}
listen.group = {USER}
listen.mode = 0666
pm = dynamic
pm.max_children = 10
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
